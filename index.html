<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    // Classic (non-module) script: runs synchronously here in <head>, before <body> is even
    // parsed, so the full theme editor UI can hide the static preview page before first paint.
    function hasStoredSpinxEditorSession() {
      if (window.self !== window.top) {
        return false;
      }
      try {
        var stored = JSON.parse(sessionStorage.getItem('spinx:editor:session') || 'null');
        return !!stored && stored.spinx_editor === '1';
      } catch (e) {
        return false;
      }
    }
    var params = new URLSearchParams(location.search);
    document.documentElement.classList.add('spinx-preview-mode');
    document.documentElement.classList.toggle(
      'spinx-editor-pending',
      params.get('spinx_editor') === '1' || hasStoredSpinxEditorSession(),
    );
  </script>
  <style>
    html.spinx-editor-pending body > *:not(#spinx-theme-editor) { display: none !important; }
  </style>

  <script type="module">
    // spinx-editor-pending was already computed synchronously up in <head> (URL param or a
    // restored session — see EDITOR_SESSION_STORAGE_KEY in src/editor/types.ts) to hide the demo
    // page before first paint; reuse that same decision here instead of re-deriving it.
    if (document.documentElement.classList.contains('spinx-editor-pending')) {
      import('https://cdn.jsdelivr.net/gh/eplugin-io/spinx-stg@2.0.2/spinx.editor.min.js');
    }

    // Neutral storefront-style preview backdrop. Real product data can be filled into
    // PREVIEW_PRODUCTS below; until then it renders skeleton cards so the page still feels like a
    // store preview, not an empty gap.
    var PREVIEW_PRODUCTS = [
      // { name: 'Product name', price: '$29.00', image: 'https://cdn.jsdelivr.net/gh/eplugin-io/spinx-stg@2.0.2/assets/images/preview/product-1.jpg' },
    ];

    function renderPreviewProducts() {
      var grid = document.getElementById('spinx-preview-products');
      if (!grid) {
        return;
      }
      var items = PREVIEW_PRODUCTS.length ? PREVIEW_PRODUCTS : new Array(4).fill(null);
      grid.innerHTML = items
        .map(function (product) {
          if (product) {
            return (
              '<div class="preview-product-card">' +
              '<div class="preview-product-image" style="background-image:url(' + product.image + ')"></div>' +
              '<div class="preview-product-name">' + product.name + '</div>' +
              '<div class="preview-product-price">' + product.price + '</div>' +
              '</div>'
            );
          }
          return (
            '<div class="preview-product-card">' +
            '<div class="preview-product-image placeholder"></div>' +
            '<div class="preview-product-name placeholder"></div>' +
            '<div class="preview-product-price placeholder"></div>' +
            '</div>'
          );
        })
        .join('');
    }

    renderPreviewProducts();
  </script>
</head>
